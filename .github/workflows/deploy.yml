name: Deploy to Surge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_js: '20'

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Deploy to Surge
        run: |
          npm install -g surge
          surge ./dist orgafoodspureorganic.surge.sh --token ${{ secrets.SURGE_TOKEN }}
